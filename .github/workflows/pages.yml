name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages einrichten (schaltet Pages beim ersten Lauf ein)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Dateien packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
